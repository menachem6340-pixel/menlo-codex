<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7c1731"><title>תפריט ראש השנה תשפ״ז</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(180deg,#fffaf0,#f5ead7);color:#38261f}.hero{padding:34px 18px 56px;text-align:center;color:#fff;background:linear-gradient(135deg,#651226,#8e2440)}.hero h1{margin:0;font-size:34px}.hero p{margin:8px 0 0;color:#f8e8d7}.wrap{max-width:820px;margin:-30px auto 40px;padding:0 14px}.bar,.card,.notes{background:#fffdf9;border:1px solid #eadbc5;border-radius:20px;box-shadow:0 12px 28px #6e3d2018}.bar{padding:12px;display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:700;font-size:15px}.edit{background:#71172e;color:#fff}.save{background:#f0d892;color:#4f3511}.share{background:#eee7de}.status{margin-right:auto;align-self:center;font-size:13px;color:#806b5f}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.tab{border:1px solid #e6d8c4;background:#fffaf4;color:#71172e;border-radius:13px;padding:10px 6px;font-weight:700}.tab.on{background:#71172e;color:#fff}.card{display:none;padding:20px}.card.on{display:block}.head{display:flex;gap:12px;align-items:center;padding-bottom:14px;border-bottom:1px solid #eee2d3}.ico{font-size:30px;width:56px;height:56px;border-radius:16px;background:#f7e5b2;display:grid;place-items:center}.head h2{margin:0;color:#71172e}.meta{font-weight:700;color:#826859;margin-top:4px}.date{font-size:13px;color:#a38c7d;margin-top:3px}.row{display:grid;grid-template-columns:10px 1fr auto auto;gap:9px;align-items:center;padding:14px 2px;border-bottom:1px solid #f1e8dc}.dot{width:9px;height:9px;background:#c59a48;border-radius:50%}.dish{font-size:18px}.tag,.badge{font-size:12px;border-radius:999px;padding:6px 8px}.tag{background:#f3eade;color:#755a49}.badge.done{background:#e7f3e8;color:#2c6c36}.badge.pick{background:#fff0c9;color:#8b5d00}.tools{display:none;gap:5px}.editing .tools{display:flex}.mini{border:0;background:#f0e8df;border-radius:8px;padding:6px}.add{display:none;margin-top:14px;gap:8px}.editing .add{display:flex}.add input,.notes textarea{width:100%;border:1px solid #ddc9b0;border-radius:12px;padding:12px;font-size:16px;direction:rtl}.add input{flex:1}.notes{padding:15px;margin-top:14px}.notes textarea{min-height:90px}.foot{text-align:center;color:#8a7568;font-size:13px;padding:18px}@media(max-width:640px){.hero h1{font-size:29px}.tabs{grid-template-columns:1fr 1fr}.row{grid-template-columns:10px 1fr auto}.tag{display:none}.bar .btn{flex:1}.status{width:100%}}</style></head><body><section class="hero"><h1>תפריט ראש השנה תשפ״ז</h1><p>תכלה שנה וקללותיה • תחל שנה וברכותיה 🍎🍯</p></section><main class="wrap"><div class="bar"><button class="btn edit" id="edit">✏️ עריכה</button><button class="btn save" id="save" style="display:none">✓ שמור</button><button class="btn share" id="share">↗ שתף</button><span class="status" id="status">טוען...</span></div><div class="tabs" id="tabs"></div><div id="cards"></div><div class="notes"><b>📝 הערות ותוספות לחג</b><textarea id="notes" disabled placeholder="רעיונות, שינויים, קניות או הערות..."></textarea></div><div class="foot">שנה טובה ומתוקה • כל שינוי נשמר ומשותף למי שמחזיק בקישור</div></main><script>const API='https://zswhqqrxdsawqgjnbnxf.supabase.co/functions/v1/rosh-hashana-menu?api=1';let data,active=0,editing=false,dirty=false;const $=x=>document.getElementById(x);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function st(t){$('status').textContent=t}async function load(){try{let r=await fetch(API,{cache:'no-store'});let d=await r.json();data=d.payload;render();st('מעודכן ומשותף ✓')}catch(e){st('לא הצלחתי לטעון')}}function render(){if(!data)return;$('notes').value=data.notes||'';$('tabs').innerHTML='';$('cards').innerHTML='';data.meals.forEach((m,mi)=>{let t=document.createElement('button');t.className='tab'+(mi===active?' on':'');t.textContent=m.title.replace('ראש השנה','ר״ה');t.onclick=()=>{active=mi;render()};$('tabs').appendChild(t);let c=document.createElement('section');c.className='card'+(mi===active?' on':'');c.innerHTML='<div class="head"><div class="ico">'+esc(m.icon)+'</div><div><h2>'+esc(m.title)+'</h2><div class="meta">'+esc(m.meta)+'</div><div class="date">'+esc(m.date)+'</div></div></div>';m.items.forEach((it,ii)=>{let r=document.createElement('div');r.className='row';r.innerHTML='<span class="dot"></span><div class="dish">'+esc(it.text)+'</div><span class="tag">'+esc(it.type||'מנה')+'</span><span class="badge '+(it.status==='סגור'?'done':'pick')+'">'+esc(it.status||'סגור')+'</span><div class="tools"><button class="mini">✏️</button><button class="mini">◐</button><button class="mini">🗑️</button></div>';let b=r.querySelectorAll('.mini');b[0].onclick=()=>{let v=prompt('עריכת המנה:',it.text);if(v&&v.trim()){it.text=v.trim();dirty=true;render();st('יש שינויים שלא נשמרו')}};b[1].onclick=()=>{it.status=it.status==='סגור'?'לבחירה':'סגור';dirty=true;render();st('יש שינויים שלא נשמרו')};b[2].onclick=()=>{if(confirm('למחוק את המנה?')){m.items.splice(ii,1);dirty=true;render();st('יש שינויים שלא נשמרו')}};c.appendChild(r)});let add=document.createElement('div');add.className='add';add.innerHTML='<input placeholder="הוסף מנה חדשה"><button class="btn edit">הוסף</button>';add.querySelector('button').onclick=()=>{let v=add.querySelector('input').value.trim();if(v){m.items.push({text:v,type:'מנה',status:'סגור'});dirty=true;render();st('יש שינויים שלא נשמרו')}};c.appendChild(add);$('cards').appendChild(c)});document.body.classList.toggle('editing',editing);$('save').style.display=editing?'inline-block':'none';$('notes').disabled=!editing;$('edit').textContent=editing?'✕ סיים עריכה':'✏️ עריכה'}async function save(){if(!dirty){st('אין שינויים לשמור');return}data.notes=$('notes').value;st('שומר...');try{let r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({payload:data})});let d=await r.json();data=d.payload;dirty=false;render();st('נשמר ומעודכן לכולם ✓')}catch(e){st('שגיאה בשמירה')}}$('edit').onclick=()=>{editing=!editing;render()};$('save').onclick=save;$('notes').oninput=()=>{dirty=true;st('יש שינויים שלא נשמרו')};$('share').onclick=async()=>{let u=location.href;try{if(navigator.share)await navigator.share({title:'תפריט ראש השנה תשפ״ז',text:'זה התפריט שלנו לראש השנה — אפשר לעבור, לערוך ולהוסיף:',url:u});else{await navigator.clipboard.writeText(u);st('הקישור הועתק')}}catch(e){}};load();</script></body></html>
